[metadata]
title = "Eat Your (Bant) Beans"   # Keep to around 35 characters
color_identity = ["W", "U", "G"]

[cards]
# Scryfall card page URLs — art crop is fetched automatically
background_card = "https://scryfall.com/card/spg/44/solitude"
foreground_cards = [
    "https://scryfall.com/card/dmu/24/leyline-binding",
    "https://scryfall.com/card/woe/195/up-the-beanstalk",
    "https://scryfall.com/card/eoe/72/quantum-riddler",
]
card_scale = 0.72
card_overlap = -0.05
card_rotation = -3.5

[title]
font_size = 125
pip_radius = 100
pip_position = 850
text_dropshadow_offset = 10

[title.shadow]
position = 700
height = 160
opacity = 0.55
