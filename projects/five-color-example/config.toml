[metadata]
title = "1 Sliver, 2 Sliver, 3 Sliver, More"   # Keep to around 35 characters
color_identity = ["W", "U", "B", "R", "G"]

[cards]
# Scryfall card page URLs — art crop is fetched automatically
background_card = "https://scryfall.com/card/tsr/248/cautery-sliver"
foreground_cards = [
    "https://scryfall.com/card/cmm/919/cloudshredder-sliver",
    "https://scryfall.com/card/mh1/200/the-first-sliver",
    "https://scryfall.com/card/cmm/900/manaweft-sliver",
]
card_scale = 0.72
card_overlap = -0.05
card_rotation = -3.5

[title]
font_size = 125
pip_radius = 100
pip_position = 850
text_dropshadow_offset = 10

[title.shadow]
position = 700
height = 160
opacity = 0.55
