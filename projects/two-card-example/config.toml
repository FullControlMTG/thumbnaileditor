[metadata]
title = "Thoracle Combo"   # Keep to around 35 characters
color_identity = ["U", "B"]

[cards]
# Scryfall card page URLs — art crop is fetched automatically
background_card = "https://scryfall.com/card/ecl/252/wistfulness"
foreground_cards = [
    "https://scryfall.com/card/thb/73/thassas-oracle",
    "https://scryfall.com/card/sta/33/tainted-pact",
]
card_scale = 0.72
card_overlap = -0.05
card_rotation = -3.5

[title]
font_size = 125
pip_radius = 100
pip_position = 850
text_dropshadow_offset = 10

[title.shadow]
position = 700
height = 160
opacity = 0.55
